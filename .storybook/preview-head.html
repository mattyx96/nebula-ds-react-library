<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet">

<style>
  input[type='radio'],
  input[type='checkbox'] {
    accent-color: #E35A3D;
  }

  /* The theme is reflected on <html data-nb-theme>, so the Storybook
     canvas (docs-story + plain preview) follows the light/dark toggle. */
  body,
  .docs-story {
    background-color: var(--nb-background-primary) !important;
    color: var(--nb-background-contrast-primary-500) !important;
  }

  a:not(.sb-anchor, .sb-unstyled, .sb-unstyled a) {
    color: #E6873E !important;
    text-decoration: underline;
  }

  a:not(.sb-anchor, .sb-unstyled, .sb-unstyled a):hover {
    color: #b45b17 !important;
  }

  code:not(.sb-anchor, .sb-unstyled, .sb-unstyled code),
  pre:not(.sb-anchor, .sb-unstyled, .sb-unstyled pre) {
    font-family: var(--nb-font-families-roboto-mono) !important;
    color: var(--nb-background-contrast-primary-500) !important;
  }

  /* Inline component mentions (`` `Paper` `` etc.) — aligned to the Nebula
     palette instead of Storybook's default white/light code chip. */
  code:not(.sb-anchor, .sb-unstyled, .sb-unstyled code) {
    background-color: var(--nb-background-accent-200) !important;
    border: var(--nb-border-0-5) solid var(--nb-background-accent-500) !important;
    border-radius: var(--nb-border-radius-10) !important;
    padding: 0 0.35em !important;
  }

  /* Code blocks (fenced code / MDX) — keep the accent surface, strip the
     default white box and give it a Nebula-tinted border. */
  pre:not(.sb-anchor, .sb-unstyled, .sb-unstyled pre),
  pre:not(.sb-anchor, .sb-unstyled, .sb-unstyled pre) code {
    background-color: var(--nb-background-accent-200) !important;
    border: var(--nb-border-1) solid var(--nb-background-accent-500) !important;
  }

  /* The Storybook docs prose surface (descriptions, MDX pages) keeps a light
     background (rgb 233,233,225 = #E9E9E1) even in dark mode because the
     docs theme hardcodes light surface tokens. Keep that prose dark-on-light
     so component descriptions stay readable in both themes. Only the story
     canvases (.docs-story) follow the light/dark toggle below. */
  .sbdocs-wrapper :where(p:not(.sb-anchor, .sb-unstyled, .sb-unstyled p)),
  .sbdocs-wrapper :where(h1:not(.sb-anchor, .sb-unstyled, .sb-unstyled h1)),
  .sbdocs-wrapper :where(h2:not(.sb-anchor, .sb-unstyled, .sb-unstyled h2)),
  .sbdocs-wrapper :where(h3:not(.sb-anchor, .sb-unstyled, .sb-unstyled h3)),
  .sbdocs-wrapper :where(h4:not(.sb-anchor, .sb-unstyled, .sb-unstyled h4)),
  .sbdocs-wrapper :where(ul:not(.sb-anchor, .sb-unstyled, .sb-unstyled ul)),
  .sbdocs-wrapper :where(ol:not(.sb-anchor, .sb-unstyled, .sb-unstyled ol)),
  .sbdocs-wrapper :where(li:not(.sb-anchor, .sb-unstyled, .sb-unstyled li)) {
    color: #3E3E3D !important;
    font: var(--nb-header3) !important;
  }

  .sbdocs-wrapper :where(p:not(.sb-anchor, .sb-unstyled, .sb-unstyled p)),
  .sbdocs-wrapper :where(ul:not(.sb-anchor, .sb-unstyled, .sb-unstyled ul)),
  .sbdocs-wrapper :where(ol:not(.sb-anchor, .sb-unstyled, .sb-unstyled ol)),
  .sbdocs-wrapper :where(li:not(.sb-anchor, .sb-unstyled, .sb-unstyled li)) {
    color: #3E3E3D !important;
    font: var(--nb-body2) !important;
  }

  /* Story canvases — follow the theme toggle (light text on dark bg). */
  .docs-story :where(p:not(.sb-anchor, .sb-unstyled, .sb-unstyled p)),
  .docs-story :where(h1:not(.sb-anchor, .sb-unstyled, .sb-unstyled h1)),
  .docs-story :where(h2:not(.sb-anchor, .sb-unstyled, .sb-unstyled h2)),
  .docs-story :where(h3:not(.sb-anchor, .sb-unstyled, .sb-unstyled h3)),
  .docs-story :where(h4:not(.sb-anchor, .sb-unstyled, .sb-unstyled h4)),
  .docs-story :where(ul:not(.sb-anchor, .sb-unstyled, .sb-unstyled ul)),
  .docs-story :where(ol:not(.sb-anchor, .sb-unstyled, .sb-unstyled ol)),
  .docs-story :where(li:not(.sb-anchor, .sb-unstyled, .sb-unstyled li)) {
    color: var(--nb-background-contrast-primary-500) !important;
    font: var(--nb-header3) !important;
  }

  .docs-story :where(p:not(.sb-anchor, .sb-unstyled, .sb-unstyled p)),
  .docs-story :where(ul:not(.sb-anchor, .sb-unstyled, .sb-unstyled ul)),
  .docs-story :where(ol:not(.sb-anchor, .sb-unstyled, .sb-unstyled ol)),
  .docs-story :where(li:not(.sb-anchor, .sb-unstyled, .sb-unstyled li)) {
    color: var(--nb-background-contrast-primary-500) !important;
    font: var(--nb-body2) !important;
  }

</style>
