# packages: ['.'] keeps pnpm 9 (used by Vercel) happy — without a
# packages field it errors with "packages field missing or empty".
# The settings below (allowBuilds, minimumReleaseAgeExclude) are pnpm 11.
packages:
  - '.'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@storybook/addon-docs@10.5.7'
  - '@storybook/builder-vite@10.5.7'
  - '@storybook/csf-plugin@10.5.7'
  - '@storybook/react-dom-shim@10.5.7'
  - '@storybook/react-vite@10.5.7'
  - '@storybook/react@10.5.7'
  - eslint-plugin-storybook@10.5.7
  - storybook@10.5.7
  - vite@8.2.1
