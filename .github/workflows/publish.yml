name: Publish to npm

# Manual trigger button in the GitHub Actions UI.
# Publishes the current version on the branch you run it against.
#
# Release flow:
#   1. Locally: `pnpm release` bumps the version, builds, commits and
#      pushes (it no longer publishes — see .scripts/release.sh).
#   2. Here: run this workflow ("Publish to npm") to build and publish
#      that version to npm with provenance.
#
# Requirements:
#   - npmjs.org must be set up for "Publish from GitHub Actions"
#     (Trusted Publishing / OIDC) for this repo, so the `id-token`
#     below is enough — no NPM_TOKEN secret is needed.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm run build

      - name: Publish to npm
        run: pnpm publish --provenance --access public
