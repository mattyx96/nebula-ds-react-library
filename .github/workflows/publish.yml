name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# The reusable `release.yml` job needs these; reusable workflows inherit
# permissions from the calling workflow.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
