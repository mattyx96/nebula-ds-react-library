name: Release (reusable)

# Shared release logic called by the "Publish patch/minor/major"
# workflows (manual triggers in the Actions UI).
#
# Bumps the version, builds, publishes to npm (with provenance) and
# commits + pushes the version bump. Publishing happens BEFORE the
# commit/push, so a failed publish leaves no bumped version on the
# remote.
#
# Requirements — pick one:
#   1. Classic token: add an npm "Automation" token as the NPM_TOKEN GitHub
#      secret (used directly, no provenance), or
#   2. OIDC / Trusted Publishing: on npmjs.org enable "Publish from GitHub
#      Actions" for this package/repo so the `id-token` below is enough
#      (adds provenance signatures, no secret needed).
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit + push the version bump
      id-token: write # Required for Trusted Publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, build, publish, commit and push
        run: sh ./.scripts/release.sh "${{ inputs.version }}" --publish
        env:
          # Optional classic npm token. When set, publishing uses it directly;
          # when absent, the script uses OIDC provenance (requires npm
          # "Publish from GitHub Actions" / Trusted Publishing to be configured).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
